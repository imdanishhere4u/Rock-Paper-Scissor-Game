<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock-Paper-Scissor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <div class="container">
    <h1>Rock-Paper-Scissor</h1>
    <div class="content">
      <img class="img" data-choice="stone" src="RockImg.png">
      <img class="img" data-choice="paper" src="PaperImg.png">
      <img class="img" data-choice="scissor" src="ScissorImg.jpg">
    </div>
    <div class="startGame">
      <p id="startgame">
        Start Game !
      </p>
    </div>
    <div class="roundshow">
      <p id="roundShow">
        Round : 10
      </p>
    </div>
    <div class="score">
      <div id="user">
        <p id="userName">
          You
        </p>
        <p id="userScore">
          0
        </p>
      </div>
      <div class="computer">
        <p id="computerName">
          computer
        </p>
        <p id="computerScore">
          0
        </p>
      </div>
    </div>
    <div id="result">
      <p id="resultShow">
        Let's Start Game !
      </p>
    </div>
    <div class="restart">
      <p id="reStart">
        Restart Game
      </p>
    </div>
  </div>  
  <script src="app.js"></script>
</body>
</html>
